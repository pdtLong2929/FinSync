# Local/demo stack. Run: docker compose up --build -d --wait
services:
  init-secrets:
    image: alpine:3.21
    restart: "no"
    volumes:
      - demo_secrets:/secrets
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        for key in DB_PASSWORD JWT_SECRET; do
          if [ ! -s /secrets/$$key ]; then
            od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /secrets/$$key
          fi
        done
        chown -R 10001:10001 /secrets
        chmod 700 /secrets
        chmod 400 /secrets/DB_PASSWORD /secrets/JWT_SECRET

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: FinSync
      POSTGRES_USER: finsync
      POSTGRES_PASSWORD_FILE: /run/finsync/DB_PASSWORD
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - demo_secrets:/run/finsync:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U finsync -d FinSync"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - demo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./src/backend
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/finsync/
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/FinSync
      DB_USERNAME: finsync
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_EXPIRATION_MS: 900000
    volumes:
      - demo_secrets:/run/finsync:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

# Separate from the earlier postgres_data/redis_data volumes; no automatic data migration.
volumes:
  demo_secrets:
  demo_postgres_data:
  demo_redis_data:
