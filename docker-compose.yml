version: '3.8'

# =======================================================
# FinSync - Centralized Docker Compose
# Services: PostgreSQL (DB), Spring Boot (Backend API)
# =======================================================

services:
  # -----------------------------------------------------
  # 1. PostgreSQL Database Service
  # -----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: finsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: FinSync
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d FinSync']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsync-network

  # -----------------------------------------------------
  # 2. Spring Boot Backend API Service
  # -----------------------------------------------------
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: finsync-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/FinSync
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - '8080:8080'
    networks:
      - finsync-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsync-network

  # -----------------------------------------------------
  # 3. Admin Web React (Uncomment when React app is ready)
  # -----------------------------------------------------
  # admin-web:
  #   build:
  #     context: ./src/admin-web
  #     dockerfile: Dockerfile
  #   container_name: finsync-admin-web
  #   restart: on-failure
  #   depends_on:
  #     - backend
  #   ports:
  #     - '3000:80'
  #   networks:
  #     - finsync-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  finsync-network:
    driver: bridge
