spring.config.import=optional:file:.env[.properties]


server.port=${SERVER_PORT:8080}

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Flyway Migration
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# ==========================================
# JWT Security
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}

# ==========================================
# Google Gemini AI API
# ==========================================
gemini.api.key=${GEMINI_API_KEY:}

# Account API: native Bearer/JSON authentication, no servlet-session persistence.
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
jwt.issuer=${JWT_ISSUER:finsync-api}
jwt.audience=${JWT_AUDIENCE:finsync-mobile}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Public readiness status only; no environment, credentials or component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
